# Technical evaluation of the character motion approach (Experiments/CharacterMotionPoC).
# Builds the MotionLab evaluation app (spine-ios + CatBehavior), runs scripted scenarios on an iOS Simulator,
# records the screen and collects the app's own diagnostics. Nothing here ships or touches NikuCue's app target.
#
# The recordings show the official Spine sample "spineboy" (evaluation only, non-commercial sample art): they are
# uploaded as short-lived workflow artifacts and are never committed to the repository.
name: Character motion PoC (Simulator)

on:
  push:
    branches: [claude/loving-gates-ak20t5]
    paths:
      - "Experiments/CharacterMotionPoC/**"
      - ".github/workflows/character-motion-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-motion-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build, run and record on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: Experiments/CharacterMotionPoC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          # use Xcode 26.6 (the version these results were produced with) when the image has it; the log records it
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app;
          else echo "::warning::Xcode 26.6 not on this image; using $(xcode-select -p)"; fi
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Engine tests (CatBehavior, macOS)
        run: |
          set -o pipefail
          swift test --package-path CatBehavior 2>&1 | tee ../../engine-tests.log

      - name: Fetch the evaluation sample (pinned commit, SHA-256 verified)
        run: ./scripts/fetch_spine_samples.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Experiments/CharacterMotionPoC/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Experiments/CharacterMotionPoC/tools/generate_motionlab_project.py') }}

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          for rt in reversed(runtimes):
              phones = [x for x in d[rt] if x["name"].startswith("iPhone") and "Pro Max" not in x["name"] and "Plus" not in x["name"]]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build MotionLab for the Simulator
        run: |
          set -o pipefail
          # Release: performance numbers (frame time, memory) from an optimized build, as shipped
          xcodebuild build -project MotionLab/MotionLab.xcodeproj -scheme MotionLab -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../../build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)|Resolved source packages|spine-runtimes" || true
          test -d build/Build/Products/Release-iphonesimulator/MotionLab.app
          # Simulators refuse to launch unsigned apps ("denied by service delegate"): sign ad hoc, as Xcode's
          # "Sign to Run Locally" does (no team, no certificate)
          codesign --force --sign - --timestamp=none build/Build/Products/Release-iphonesimulator/MotionLab.app
          codesign --verify --verbose build/Build/Products/Release-iphonesimulator/MotionLab.app

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Run scenarios with screen recording
        run: ./scripts/ci_simulator_run.sh build/Build/Products/Release-iphonesimulator/MotionLab.app "${{ steps.sim.outputs.udid }}" ci-results

      - name: Summarize diagnostics
        if: always()
        run: |
          mkdir -p ci-results
          cp ../../build.log ../../engine-tests.log ci-results/ 2>/dev/null || true
          python3 -I scripts/summarize_diagnostics.py ci-results | tee ci-results/summary.md || true
          cat ci-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          # the full diagnostics, so they can be read from the job log as well as from the artifact
          for f in ci-results/diagnostics-*.json; do [ -f "$f" ] && { echo "=== $f"; python3 -c "import json,sys; d=json.load(open(sys.argv[1])); [s.pop('samples', None) for s in [d.get('memoryMB', {})]]; print(json.dumps(d, sort_keys=True))" "$f"; }; done || true

      - name: Review frames (small JPEGs in the log, for reviewers without artifact access)
        if: always()
        run: |
          python3 -m venv /tmp/review && /tmp/review/bin/pip install --quiet pillow==11.3.0 || exit 0
          /tmp/review/bin/python -I scripts/review_frames.py ci-results || true

      - name: Recording frames (low resolution, for reviewers without artifact access)
        if: always()
        run: |
          # decode with scripts/decode_video_frames.py; the full-resolution recordings are in the artifact
          for spec in "autonomous 4 150 100" "interaction 4 150 100" "lifecycle 3 150 60" "flipbook 2 150 75"; do
            set -- $spec
            [ -f "ci-results/$1.mp4" ] && swift scripts/extract_video_frames.swift "ci-results/$1.mp4" "$1" "$2" "$3" "$4" || true
          done

      - name: Upload recordings and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motionlab-simulator-results
          path: Experiments/CharacterMotionPoC/ci-results
          retention-days: 14
